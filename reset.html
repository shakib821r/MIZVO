<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MIZVO | Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;600&display=swap">
<link rel="stylesheet" href="mizvo.css">
<script src="mizvo-theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="m-page">

<svg width="48" height="48" viewBox="0 0 64 64" role="img" aria-label="MIZVO">
<path d="M30 4A24 24 0 0 0 30 52Z" fill="var(--logo-left)"/>
<path d="M34 12A24 24 0 0 1 34 60Z" fill="var(--logo-right)"/>
</svg>

<h1 class="m-title" id="heading">Reset password</h1>
<p class="m-sub" id="subtitle">Checking your reset link...</p>

<form id="resetForm" novalidate style="display:flex;flex-direction:column;gap:14px" hidden>
<div class="m-field">
<label for="newPassword">New password</label>
<div class="m-pw">
<input class="m-input" id="newPassword" type="password" autocomplete="new-password">
<button class="m-toggle" id="togglePw" type="button" aria-pressed="false" aria-label="Show passwords">Show</button>
</div>
</div>
<div class="m-field">
<label for="confirmPassword">Confirm new password</label>
<input class="m-input" id="confirmPassword" type="password" autocomplete="new-password">
</div>
<button class="m-btn" id="updateBtn" type="submit">Update password</button>
</form>

<button class="m-btn" id="newLinkBtn" type="button" hidden>Request a new link</button>

<div class="m-msg" id="message" role="status" aria-live="polite"></div>

<button class="m-link" id="backBtn" type="button">Back to sign in</button>

</main>

<script>
const SUPABASE_URL = "https://xpeslwtkzeybwydhzcls.supabase.co";
const SUPABASE_KEY = "sb_publishable_fvQoiONlnGaYpOKg7ao3qw_xLs00O_6";

// Read the link information BEFORE the Supabase client starts, so nothing is lost.
const linkParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
const linkHadError = Boolean(linkParams.get("error") || linkParams.get("error_description"));
const linkIsRecovery = linkParams.get("type") === "recovery";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const BUSY_ICON =
'<svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">' +
'<path class="hl" d="M30 4A24 24 0 0 0 30 52Z" fill="var(--on-primary)"/>' +
'<path class="hr" d="M34 12A24 24 0 0 1 34 60Z" fill="var(--mint)"/></svg><span>Please wait</span>';

const $ = (id) => document.getElementById(id);
const resetForm = $("resetForm"), newPassword = $("newPassword"), confirmPassword = $("confirmPassword");
const updateBtn = $("updateBtn"), newLinkBtn = $("newLinkBtn"), message = $("message");

let formShown = false;
let expiredShown = false;
let passwordUpdated = false;

function showMsg(text, isError) {
  message.textContent = text || "";
  message.className = "m-msg" + (isError ? " is-error" : "");
}

function showForm() {
  if (formShown || passwordUpdated) return;
  formShown = true;
  newLinkBtn.hidden = true;
  $("heading").textContent = "Set a new password";
  $("subtitle").textContent = "Choose a new password for your account.";
  resetForm.hidden = false;
  // Remove the one-time tokens from the address bar and browser history
  try { history.replaceState(null, "", window.location.pathname); } catch (e) {}
}

function showExpired() {
  if (formShown || expiredShown || passwordUpdated) return;
  expiredShown = true;
  $("heading").textContent = "Link expired";
  $("subtitle").textContent = "This reset link is invalid, already used, or has expired. Please request a new one.";
  newLinkBtn.hidden = false;
}

function friendlyError(error) {
  const text = (error && error.message) ? error.message : "Something went wrong. Please try again.";
  const lower = text.toLowerCase();
  if (lower.includes("different from the old password")) return "Please choose a password you have not used before.";
  if (lower.includes("session missing") || lower.includes("expired") || lower.includes("invalid")) return "Your reset link has expired. Please request a new one.";
  if (lower.includes("failed to fetch") || lower.includes("network")) return "Network problem. Check your internet connection and try again.";
  return text;
}

$("backBtn").addEventListener("click", () => { window.location.href = "auth.html"; });
newLinkBtn.addEventListener("click", () => { window.location.href = "auth.html#forgot"; });

// One button shows or hides BOTH password fields together
$("togglePw").addEventListener("click", (e) => {
  const show = newPassword.type === "password";
  const type = show ? "text" : "password";
  newPassword.type = type;
  confirmPassword.type = type;
  e.currentTarget.textContent = show ? "Hide" : "Show";
  e.currentTarget.setAttribute("aria-pressed", String(show));
  e.currentTarget.setAttribute("aria-label", show ? "Hide passwords" : "Show passwords");
});

// Supabase tells us when a valid recovery link has been opened
client.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") showForm();
});

resetForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  showMsg("");

  if (newPassword.value.length < 6) { showMsg("Password must be at least 6 characters.", true); return; }
  if (newPassword.value !== confirmPassword.value) { showMsg("The two passwords do not match.", true); return; }

  updateBtn.dataset.label = updateBtn.textContent;
  updateBtn.classList.add("is-busy");
  updateBtn.innerHTML = BUSY_ICON;
  updateBtn.disabled = true;

  try {
    const { error } = await client.auth.updateUser({ password: newPassword.value });
    if (error) throw error;

    passwordUpdated = true;
    showMsg("Password updated! Taking you to sign in...");
    try { await client.auth.signOut(); } catch (err) {
      console.error("MIZVO signOut after reset:", err && err.message);
    }
    window.location.replace("auth.html#password-updated");
  } catch (error) {
    console.error("MIZVO reset error:", error && error.code, error && error.message);
    showMsg(friendlyError(error), true);
    updateBtn.classList.remove("is-busy");
    updateBtn.textContent = updateBtn.dataset.label;
    updateBtn.disabled = false;
  }
});

(async () => {
  if (linkHadError) { showExpired(); return; }
  try {
    const { data } = await client.auth.getSession();
    if (data && data.session && linkIsRecovery) showForm();
  } catch (error) {
    console.error("MIZVO session check error:", error && error.message);
  }
  // If no valid recovery link was detected shortly after loading, treat it as invalid
  setTimeout(showExpired, 4000);
})();
</script>
</body>
</html>
